name: Dnevni dohvat oglasa

on:
  # Pet termina kroz dan; posao odradi onaj koji prvi prođe, ostali tog dana izađu odmah.
  # Tako se vrijeme dohvata mijenja iz dana u dan, a kašnjenje GitHuba (scheduled poslovi
  # znaju krenuti i pola sata kasnije) ne može preskočiti cijeli dan.
  schedule:
    - cron: '17 5 * * *'
    - cron: '43 8 * * *'
    - cron: '11 12 * * *'
    - cron: '29 16 * * *'
    - cron: '53 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dohvat
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Je li već dohvaćeno danas
        id: check
        run: |
          today=$(date -u +%F)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Ručno pokretanje — dohvaća se bez obzira na zadnji dohvat."
            echo "run=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last=$(node -p "try{require('./public/data/listings.json').generatedAt.slice(0,10)}catch{''}")
          echo "Zadnji dohvat: ${last:-nepoznat} | danas: $today"

          if [ "$last" = "$today" ]; then
            echo "Već dohvaćeno danas — ovaj termin se preskače."
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.run == 'yes'
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
        if: steps.check.outputs.run == 'yes'

      # run.js preživi pad pojedinog izvora, pa se sprema ono što je dohvaćeno.
      # Facebook se ovdje ne dohvaća — njegova sesija je vezana uz osobno računalo.
      - run: npm run refresh
        if: steps.check.outputs.run == 'yes'

      - name: Spremi deltu u repo
        if: steps.check.outputs.run == 'yes'
        run: |
          git config user.name 'autoradar'
          git config user.email 'autoradar@users.noreply.github.com'
          git add data/autoradar.sqlite public/data/listings.json
          if git diff --staged --quiet; then
            echo 'Nema promjena za spremiti.'
          else
            git commit -m "Oglasi: $(date -u '+%Y-%m-%d %H:%M')"
            git push
          fi
